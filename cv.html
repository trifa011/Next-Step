
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Step - Submit Your CV</title>
    <style>
        body {
            background-color: #F5F0E8;
            color: #0F2C5C;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 0;
        }
        .header {
            background-color: #0F2C5C;
            color: #F5F0E8;
            padding: 25px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 42px; letter-spacing: 2px; }
        .header p { margin: 5px 0 0 0; font-size: 18px; opacity: 0.9; }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(15, 44, 92, 0.15);
            border: 2px solid #E8DCC6;
        }
        h2 { text-align: center; color: #0F2C5C; margin-bottom: 25px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; margin-top: 6px;
            border: 2px solid #D9CFC0; border-radius: 8px;
            background-color: #FDFBF7; color: #0F2C5C;
            font-size: 15px; box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0F2C5C; }
        .btn {
            width: 100%; margin-top: 25px; padding: 14px;
            background-color: #0F2C5C; color: #F5F0E8;
            border: none; border-radius: 8px; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background-color: #163d7a; transform: translateY(-2px); }
        .footer { text-align: center; padding: 20px; font-size: 14px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NEXT STEP</h1>
        <p>Find Your Career Opportunity - CV Submission Platform</p>
    </div>
    <div class="container">
        <h2>Submit Your CV Here</h2>
        <form action="https://formsubmit.co/danyabakrr@gmail.com" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            
            <label>Full Name:</label>
            <input type="text" name="fullname" placeholder="Enter your full name" required>

            <label>Email:</label>
            <input type="email" name="email" placeholder="example@email.com" required>

            <label>Phone Number:</label>
            <input type="tel" name="phone" placeholder="0750 xxx xxxx" required>

            <label>Field / Specialization:</label>
            <select name="field" required>
                <option value="">-- Select your field --</option>
                <option>IT & Computer</option>
                <option>Accounting</option>
                <option>Administration</option>
                <option>Engineering</option>
                <option>Teaching</option>
                <option>Other</option>
            </select>

            <label>Your CV (PDF / Word):</label>
            <input type="file" name="attachment" accept=".pdf,.doc,.docx" required>

            <label>About You:</label>
            <textarea name="about" rows="4" placeholder="Tell us about your skills and experience..."></textarea>

            <button type="submit" class="btn">Submit CV</button>
        </form>
    </div>
    <div class="footer">© 2026 Next Step - All Rights Reserved</div>
</body>
</html>
