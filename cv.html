<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Next Step - Submit Your CV</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f6f7f5;
            color: #1b2422;
            font-family: Georgia, serif;
            line-height: 1.5;
            transition: 0.3s;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background-color: white;
            border-bottom: 1px solid #dfe4e0;
            padding: 30px 20px;
            text-align: center;
            transition: 0.3s;
        }

        .logo {
            display: inline-block;
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: bold;
            color: #1b2422;
        }

        .logo span {
            color: #c1622a;
        }

        .header h1 {
            font-family: "Fraunces", Georgia, serif;
            font-size: 32px;
            letter-spacing: 2px;
            color: #1b2422;
        }

        .header h1 span {
            color: #c1622a;
        }

        .header p {
            margin-top: 15px;
            font-size: 16px;
            color: #5c665f;
        }

        .header nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .header nav a {
            color: #5c665f;
            font-size: 15px;
            transition: 0.2s;
        }

        .header nav a:hover {
            color: #1b2422;
        }

        .header nav a.active {
            color: #c1622a;
            font-weight: bold;
        }

        /* =========================
           DARK MODE BUTTON
        ========================= */

        #darkModeBtn {
            margin-top: 20px;
            border: 1px solid #dfe4e0;
            background-color: transparent;
            color: #1b2422;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: Georgia, serif;
            font-size: 14px;
            transition: 0.3s;
        }

        #darkModeBtn:hover {
            background-color: #f6f7f5;
        }

        /* =========================
           FORM CARD
        ========================= */

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #dfe4e0;
            box-shadow: 0 10px 25px rgba(27, 36, 34, 0.08);
            transition: 0.3s;
        }

        h2 {
            text-align: center;
            font-family: "Fraunces", Georgia, serif;
            font-size: 28px;
            color: #1b2422;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #1b2422;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe4e0;
            border-radius: 8px;
            background-color: #f6f7f5;
            color: #1b2422;
            font-size: 15px;
            font-family: Georgia, serif;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #c1622a;
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        .btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #c1622a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #9e4e20;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid #dfe4e0;
            color: #5c665f;
            font-size: 14px;
            transition: 0.3s;
        }

        /* =========================
           DARK MODE
        ========================= */

        body.dark-mode {
            background-color: #121816;
            color: #f1f3f2;
        }

        body.dark-mode .header {
            background-color: #18211e;
            border-color: #303a36;
        }

        body.dark-mode .logo {
            color: #f1f3f2;
        }

        body.dark-mode .header nav a {
            color: #b7c0bb;
        }

        body.dark-mode .header nav a:hover {
            color: #ffffff;
        }

        body.dark-mode .header nav a.active {
            color: #d8753d;
        }

        body.dark-mode .header p {
            color: #b7c0bb;
        }

        body.dark-mode #darkModeBtn {
            background-color: #29332f;
            color: #f1f3f2;
            border-color: #4a5550;
        }

        body.dark-mode #darkModeBtn:hover {
            background-color: #35413c;
        }

        body.dark-mode .container {
            background-color: #202b27;
            border-color: #39443f;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        body.dark-mode h2 {
            color: #f1f3f2;
        }

        body.dark-mode label {
            color: #f1f3f2;
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode textarea {
            background-color: #29332f;
            color: #f1f3f2;
            border-color: #39443f;
        }

        body.dark-mode input::placeholder,
        body.dark-mode textarea::placeholder {
            color: #9da8a2;
        }

        body.dark-mode input:focus,
        body.dark-mode select:focus,
        body.dark-mode textarea:focus {
            border-color: #c1622a;
        }

        body.dark-mode .footer {
            border-color: #303a36;
            color: #b7c0bb;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {
                padding: 25px 15px;
            }

            .header nav {
                gap: 15px;
            }

            .header nav a {
                font-size: 13px;
            }

            .container {
                margin: 25px 15px;
                padding: 25px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <a class="logo" href="index.html">
            Next<span>Step</span>
        </a>

        <nav>
            <a href="skills.html">Learn Skills</a>
            <a href="internships.html">Find Internships</a>
            <a href="cv.html" class="active">Build Your CV</a>
            <a href="jobs.html">Find Jobs</a>
        </nav>

        <button id="darkModeBtn">🌙 Dark Mode</button>

        <p>Find Your Career Opportunity - CV Submission Platform</p>

    </div>


    <!-- =========================
         CV FORM
    ========================= -->

    <div class="container">

        <h2>Submit Your CV Here</h2>

        <form 
            action="https://formsubmit.co/danyabakrr@gmail.com" 
            method="POST" 
            enctype="multipart/form-data"
        >

            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <label>Full Name:</label>
            <input 
                type="text" 
                name="fullname" 
                placeholder="Enter your full name" 
                required
            >

            <label>Email:</label>
            <input 
                type="email" 
                name="email" 
                placeholder="example@email.com" 
                required
            >

            <label>Phone Number:</label>
            <input 
                type="tel" 
                name="phone" 
                placeholder="0750 xxx xxxx" 
                required
            >

            <label>Field / Specialization:</label>

            <select name="field" required>

                <option value="">-- Select your field --</option>
                <option>IT & Computer</option>
                <option>Accounting</option>
                <option>Administration</option>
                <option>Engineering</option>
                <option>Teaching</option>
                <option>Other</option>

            </select>

            <label>Your CV (PDF / Word):</label>

            <input 
                type="file" 
                name="attachment" 
                accept=".pdf,.doc,.docx" 
                required
            >

            <label>About You:</label>

            <textarea 
                name="about" 
                rows="4" 
                placeholder="Tell us about your skills and experience..."
            ></textarea>

            <button type="submit" class="btn">
                Submit CV
            </button>

        </form>

    </div>


    <!-- =========================
         FOOTER
    ========================= -->

    <div class="footer">
        © 2026 Next Step - All Rights Reserved
    </div>


    <!-- =========================
         DARK MODE JAVASCRIPT
    ========================= -->

    <script>

        const darkModeBtn = document.getElementById("darkModeBtn");

        /* Check if dark mode was already selected */
        if (localStorage.getItem("darkMode") === "enabled") {

            document.body.classList.add("dark-mode");

            darkModeBtn.textContent = "☀️ Light Mode";
        }


        /* Dark mode button */
        darkModeBtn.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {

                localStorage.setItem("darkMode", "enabled");

                darkModeBtn.textContent = "☀️ Light Mode";

            } else {

                localStorage.setItem("darkMode", "disabled");

                darkModeBtn.textContent = "🌙 Dark Mode";
            }

        });

    </script>

</body>
</html>
