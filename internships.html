<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextStep - Find Internships</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #f7f9fc; color: #333; }

/* NAVBAR */
.navbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 50px; background-color: #fff; border-bottom: 1px solid #e2e8f0; }
.logo { font-size: 24px; font-weight: bold; color: #1e3a8a; }
.logo span { color: #2563eb; }
.navbar nav a { margin: 0 15px; text-decoration: none; color: #4b5563; font-weight: 500; transition: .2s; }
.navbar nav a:hover, .navbar nav a.active { color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 5px; }
.auth-buttons .btn-login { background: none; border: none; padding: 8px 16px; cursor: pointer; font-weight: 600; color: #4b5563; }
.auth-buttons .btn-start { background-color: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: .3s; }
.auth-buttons .btn-start:hover { background-color: #1d4ed8; }

/* HERO */
.hero-section { text-align: center; padding: 60px 20px; background-color: #fff; }
.hero-section h1 { font-size: 32px; color: #0f172a; margin-bottom: 10px; }
.hero-section p { color: #64748b; margin-bottom: 30px; }

/* SEARCH BOX */
.search-box { display: flex; justify-content: center; gap: 12px; max-width: 900px; margin: 0 auto; background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); border: 1px solid #e2e8f0; }
.input-group { display: flex; align-items: center; background: #f8fafc; padding: 10px 14px; border-radius: 8px; flex: 1; border: 1px solid #cbd5e1; }
.input-group i { color: #94a3b8; margin-right: 10px; }
.input-group input, .input-group select { border: none; background: transparent; width: 100%; outline: none; font-size: 14px; }
.btn-search { background-color: #2563eb; color: #fff; border: none; padding: 0 25px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: .2s; }
.btn-search:hover { background-color: #1d4ed8; }

/* INTERNSHIPS GRID */
.internships-section { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
.internships-section h2 { font-size: 22px; margin-bottom: 24px; color: #1e293b; }
.grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

.card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,.04); transition: transform .2s, box-shadow .2s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,.08); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

.company-logo { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.company-logo.blue { background-color: #e0f2fe; color: #0284c7; }
.company-logo.purple { background-color: #f3e8ff; color: #9333ea; }
.company-logo.orange { background-color: #ffedd5; color: #ea580c; }
.company-logo.green { background-color: #dcfce7; color: #16a34a; }

.badge { background-color: #e0e7ff; color: #3730a3; padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 20px; }

.card h3 { font-size: 18px; color: #0f172a; }
.company-name { color: #64748b; font-size: 14px; margin-bottom: 12px; }

.details { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #475569; margin-bottom: 12px; }
.details i { color: #64748b; margin-right: 4px; }

.description { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 16px; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.tags span { background-color: #f1f5f9; color: #475569; font-size: 12px; padding: 4px 8px; border-radius: 4px; }

.card-footer { display: flex; gap: 10px; }
.btn-apply { flex: 1; background-color: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn-apply:hover { background-color: #1d4ed8; }
.btn-save { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 6px; cursor: pointer; }
.btn-save:hover { background-color: #e2e8f0; }
.btn-save.saved { background-color: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .search-box { flex-direction: column; }
  .navbar nav { display: none; }
}
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">Next<span>Step</span></div>
  <nav>
   
    <a href="#" class="active">Find Internships</a>
    
   
  </nav>
  
</header>

<section class="hero-section">
  <h1>Internship Opportunities for Next-Gen Leaders</h1>
  <p>Find hands-on experience, build your network, and launch your career.</p>
</section>

<section class="internships-section">
  <h2>Available Internships</h2>
  <div class="grid-container" id="internship-list"></div>
</section>

<script>
// ===== INTERNSHIP DATA =====
const internships = [
  {
    title: "Frontend Developer Intern",
    company: "TechCorp Solutions",
    location: "Erbil / Remote",
    duration: "3 Months",
    salary: "Paid ($300/mo)",
    type: "Remote",
    logoo: "fa-solid fa-code",
    logoColor: "blue",
    description: "Join our product team to build modern user interfaces.",
    tags: ["React", "JavaScript", "HTML/CSS"]
  },
  {
    title: "UI/UX Design Intern",
    company: "Creative Studio",
    location: "Sulaymaniyah",
    duration: "2 Months",
    salary: "Stipend",
    type: "On-site",
    logoo: "fa-solid fa-paint-brush",
    logoColor: "purple",
    description: "Design wireframes and interactive prototypes.",
    tags: ["Figma", "UI/UX", "Wireframing"]
  },
  {
    title: "Content Creator Intern",
    company: "Media Hub",
    location: "Erbil",
    duration: "3 Months",
    salary: "Paid ($250/mo)",
    type: "Hybrid",
    logoo: "fa-regular fa-bookmark",
    logoColor: "orange",
    description: "Create engaging content, organize digital materials, and help manage online content.",
    tags: ["Content Writing", "Social Media", "Canva"]
  },
  {
    title: "Digital Marketing Intern",
    company: "Growth Agency",
    location: "Erbil / Remote",
    duration: "4 Months",
    salary: "Paid ($300/mo)",
    type: "Hybrid",
    logoo: "fa-solid fa-chart-line",
    logoColor: "green",
    description: "Work on marketing campaigns, SEO, social media, and analyze campaign performance.",
    tags: ["SEO", "Marketing", "Analytics"]
  }
];

// ===== RENDER THE INTERNSHIP CARDS =====
const list = document.getElementById("internship-list");

function renderInternships() {
  let cardsHTML = "";

  internships.forEach(function (job) {
    let tagsHTML = "";
    job.tags.forEach(function (tag) {
      tagsHTML += `<span>${tag}</span>`;
    });

    cardsHTML += `
      <div class="card">
        <div class="card-header">
          <div class="company-logo ${job.logoColor}">
            <i class="${job.logoo}"></i>
          </div>
          <span class="badge">${job.type}</span>
        </div>

        <h3>${job.title}</h3>
        <p class="company-name">${job.company}</p>

        <div class="details">
          <span><i class="fa-solid fa-location-dot"></i>${job.location}</span>
          <span><i class="fa-solid fa-clock"></i>${job.duration}</span>
          <span><i class="fa-solid fa-sack-dollar"></i>${job.salary}</span>
        </div>

        <p class="description">${job.description}</p>

        <div class="tags">${tagsHTML}</div>

        <div class="card-footer">
          <button class="btn-apply">Apply Now</button>
          <button class="btn-save"><i class="fa-regular fa-bookmark"></i></button>
        </div>
      </div>
    `;
  });

  list.innerHTML = cardsHTML;

  // Apply button
  document.querySelectorAll(".btn-apply").forEach(function (button) {
    button.addEventListener("click", function () {
      alert("Application feature can be connected to your backend later.");
    });
  });

  // Save button (toggle saved state)
  document.querySelectorAll(".btn-save").forEach(function (button) {
    button.addEventListener("click", function () {
      button.classList.toggle("saved");
    });
  });
}

renderInternships();
</script>

</body>
</html>
